name: Windows Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers on v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write   # needed to create GitHub releases and upload assets

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gpl-app     # build from the gpl-app branch

      # ── 2. Set up Python ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ──────────────────────────────────────────────
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      # ── 4. (wkhtmltopdf skipped — PDF generation disabled for now) ──────────

      # ── 5. Extract version from tag ──────────────────────────────────────────
      - name: Extract version
        id: version
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v1.0.1
          $ver = $tag.TrimStart("v")               # e.g. 1.0.1
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"     >> $env:GITHUB_OUTPUT
          # Update version.py in-place so the frozen exe reports the right version
          (Get-Content desktop\version.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$ver`"" |
            Set-Content desktop\version.py
          Write-Host "Building version $ver"
        shell: pwsh

      # ── 6. PyInstaller freeze ────────────────────────────────────────────────
      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm desktop\packaging\gpl_platform.spec
        env:
          PYTHONPATH: .

      # ── 7. Verify exe exists ──────────────────────────────────────────────────
      - name: Verify build output
        run: |
          $exe = "desktop\packaging\dist\GPL Platform\GPL Platform.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build failed: exe not found at $exe"
            exit 1
          }
          Write-Host "Build OK: $(Get-Item $exe | Select-Object -ExpandProperty Length) bytes"
        shell: pwsh

      # ── 8. Build Inno Setup installer (.exe) ──────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          iscc /Q "/DMyAppVersion=$ver" desktop\packaging\installer.iss
          $installer = "desktop\packaging\dist\GPLPlatform_Setup_v$ver.exe"
          Write-Host "Installer: $(Get-Item $installer | Select-Object -ExpandProperty Length) bytes"
        shell: pwsh

      # ── 9. Create update ZIP (flat — no subfolder) ───────────────────────────
      - name: Create update ZIP
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = "desktop\packaging\dist\GPL Platform"
          $zip = "desktop\packaging\dist\GPLPlatform-$ver-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Write-Host "ZIP: $(Get-Item $zip | Select-Object -ExpandProperty Length) bytes"
        shell: pwsh

      # ── 10. Compute SHA-256 of the update ZIP ────────────────────────────────
      - name: Compute SHA-256
        id: sha
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $zip = "desktop\packaging\dist\GPLPlatform-$ver-windows.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          echo "SHA256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"
        shell: pwsh

      # ── 11. Generate latest.json manifest ────────────────────────────────────
      - name: Generate latest.json
        run: |
          $ver  = "${{ steps.version.outputs.VERSION }}"
          $tag  = "${{ steps.version.outputs.TAG }}"
          $sha  = "${{ steps.sha.outputs.SHA256 }}"
          $repo = "meetbadgujar14/gpl-platform-releases"
          $url  = "https://github.com/$repo/releases/download/$tag/GPLPlatform-$ver-windows.zip"

          $manifest = @{
            windows = @{
              version = $ver
              url     = $url
              sha256  = $sha
              notes   = "GPL Platform $ver"
            }
          } | ConvertTo-Json -Depth 3

          $manifest | Set-Content "desktop\packaging\dist\latest.json"
          Write-Host $manifest
        shell: pwsh

      # ── 12. Create GitHub Release and upload assets ───────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "GPL Platform ${{ steps.version.outputs.VERSION }}"
          body: "GPL Platform ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: false
          repository: meetbadgujar14/gpl-platform-releases
          token: ${{ secrets.RELEASE_PAT }}
          files: |
            desktop/packaging/dist/GPLPlatform_Setup_v${{ steps.version.outputs.VERSION }}.exe
            desktop/packaging/dist/GPLPlatform-${{ steps.version.outputs.VERSION }}-windows.zip
            desktop/packaging/dist/latest.json
